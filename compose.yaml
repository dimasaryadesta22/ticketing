# Docker Compose Tiketin: app (dari Docker Hub) + PostgreSQL.
# Semua nilai rahasia dibaca dari file .env (lihat .env.example).
name: tiketin

services:
  app:
    # Image hasil pipeline Jenkins, BUKAN build lokal.
    image: ${DOCKERHUB_USER:?isi DOCKERHUB_USER di .env}/tiketin:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?isi SECRET_KEY di .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tiketin.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env}
      APP_TIMEZONE: Asia/Jakarta
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend   # agar port 8000 bisa diakses dari host
      - backend    # agar bisa bicara dengan database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiketin}
      POSTGRES_USER: ${POSTGRES_USER:-tiketin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend    # database TIDAK punya port publik, hanya di network internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  backend:
    internal: true   # tidak ada akses keluar/masuk dari luar Docker
  frontend: {}

volumes:
  db-data:
